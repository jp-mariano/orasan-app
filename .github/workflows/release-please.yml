# Release Please opens/updates a "Release PR" from Conventional Commits on main.
# Merging that PR creates a GitHub release and updates CHANGELOG.md + package.json version.
# See: https://github.com/googleapis/release-please-action

name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Use a PAT if you need full CI to run on the Release PR (optional).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: node
